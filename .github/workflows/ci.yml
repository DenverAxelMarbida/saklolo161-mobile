name: Mobile CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Lint
        run: npm run lint

      - name: Doctor
        run: npx expo-doctor

      - name: Build Sanity Check (expo export)
        run: npx expo export --platform android --output-dir .expo-ci-check